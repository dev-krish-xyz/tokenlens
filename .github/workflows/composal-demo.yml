name: Composal demo

on:
  push:
    branches: [demo/composal-stream-usage]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  stream-regression:
    if: github.event_name == 'push' || github.head_ref == 'demo/composal-stream-usage'
    name: Stream usage regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Reproduce fragmented SSE usage accounting
        working-directory: gateway
        run: bun test src/handlers/stream.test.ts

  quality:
    if: github.event_name == 'push' || github.head_ref == 'demo/composal-stream-usage'
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        # Existing module mocks otherwise leak between files in discovery order.
        run: bun run turbo test --continue=always -- --isolate
