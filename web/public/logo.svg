<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="TokenLens">
  <defs>
    <linearGradient id="tl-plate" x1="80" y1="40" x2="430" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F7F7F8"/>
      <stop offset="1" stop-color="#ECECEE"/>
    </linearGradient>
    <linearGradient id="tl-orb" x1="196" y1="176" x2="328" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5AB4FF"/>
      <stop offset="0.45" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="tl-orb-shine" x1="220" y1="200" x2="280" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="tl-inner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#FFFFFF" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- App plate -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#tl-plate)" filter="url(#tl-shadow)"/>
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>

  <!-- Bottom-left bracket -->
  <path
    d="M148 220
       V332
       C148 368 178 398 214 398
       H332"
    stroke="#12141A"
    stroke-width="46"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#tl-inner)"
  />

  <!-- Top-right bracket -->
  <path
    d="M364 292
       V180
       C364 144 334 114 298 114
       H180"
    stroke="#12141A"
    stroke-width="46"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#tl-inner)"
  />

  <!-- Core orb -->
  <circle cx="256" cy="256" r="62" fill="url(#tl-orb)"/>
  <circle cx="256" cy="256" r="62" fill="url(#tl-orb-shine)"/>
  <circle cx="236" cy="232" r="18" fill="rgba(255,255,255,0.35)"/>
</svg>
